name: Offline source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-only tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q server.py src
